<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitBuddy – AI Workout Generator</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="header">
    <a href="/" class="brand">
      🏋️ FitBuddy <span>AI</span>
    </a>
    <nav class="nav-links">
      <a href="/" class="active">Generate Plan</a>
      <a href="/view-all-users">Admin Dashboard</a>
    </nav>
  </header>

  <main class="container">
    <div class="hero-card">
      <h1 style="font-size: 2rem; margin-bottom: 8px;">Personalized 7-Day Fitness Plan Generator</h1>
      <p style="color: var(--text-muted); line-height: 1.6;">
        Powered by Google Gemini Models. Enter your profile to receive a science-backed day-by-day workout routine and tailored nutrition guidance.
      </p>

      <form action="/generate-workout" method="POST" style="margin-top: 24px;">
        <div class="form-grid">
          <div class="form-group">
            <label for="username">Full Name</label>
            <input type="text" id="username" name="username" placeholder="e.g. Alex Morgan" required value="Alex Morgan">
          </div>

          <div class="form-group">
            <label for="user_id">Unique User ID</label>
            <input type="text" id="user_id" name="user_id" placeholder="e.g. alex_fitness" required value="alex_m">
          </div>

          <div class="form-group">
            <label for="age">Age (Years)</label>
            <input type="number" id="age" name="age" min="14" max="100" placeholder="e.g. 26" required value="26">
          </div>

          <div class="form-group">
            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" name="weight" min="30" max="250" placeholder="e.g. 72" required value="72">
          </div>

          <div class="form-group">
            <label for="goal">Fitness Goal</label>
            <select id="goal" name="goal" required>
              <option value="weight_loss">Weight Loss & Fat Burn</option>
              <option value="muscle_gain" selected>Muscle Gain & Hypertrophy</option>
              <option value="endurance">Endurance & Stamina</option>
              <option value="general_wellness">General Wellness & Mobility</option>
              <option value="flexibility">Flexibility & Core Strength</option>
            </select>
          </div>

          <div class="form-group">
            <label for="intensity">Workout Intensity</label>
            <select id="intensity" name="intensity" required>
              <option value="low">Low (Beginner / Recovery)</option>
              <option value="medium" selected>Medium (Moderate Challenge)</option>
              <option value="high">High (Advanced / Athlete)</option>
            </select>
          </div>
        </div>

        <div style="margin-top: 32px; display: flex; gap: 16px;">
          <button type="submit" class="btn" style="flex: 1;">
            ✨ Generate 7-Day Plan with Gemini
          </button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
